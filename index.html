      holes = HX.map(x => ({ x, st: 'down', sp: 0, rise: 0, life: 0, dur: 3.6, tm: 0, hinted: false, glow: false }));
    }
    function startGame() { reset(); state = 'play'; sfx.start(); }
    function resolve() {
      const h = toss.hole >= 0 ? holes[toss.hole] : null;
      if (h && h.st === 'up' && h.rise > 0.4) {
        if (SPECIES[h.sp].food === toss.food) {                          // yummy!
          score++; h.st = 'happy'; h.tm = 0.95; sfx.collect();
          for (let i = 0; i < 3; i++) hearts.push({ x: h.x + (i - 1) * 24, y: HY - 80 - i * 8, vy: -70 - i * 14, life: 1.1, max: 1.1 });
          pBurst(parts, h.x, HY - 60, C.yellow, 10);
          if (score > hi) { hi = score; hiSet('feed', hi); }
        } else {                                                          // "no thank you"
          h.st = 'no'; h.tm = 0.9; lives--; sfx.miss();
          if (lives <= 0) { state = 'over'; overAt = performance.now(); sfx.over(); }
        }
      } else { sfx.miss(); pBurst(parts, toss.tx, HY, '#c4915a', 6, 400); }
    }
    function drawAnimal(kind, mood) {

  // =====================================================================

    return {

        ry += (target - ry) * Math.min(1, dt * 14);
        tilt = clamp((target - ry) / 60, -1, 1) * 0.4;
        wobble = Math.max(0, wobble - dt * 1.2);

      draw(now) {
        sky('#0e1236', '#5a3f94');
        ctx.fillStyle = 'rgba(255,138,174,.10)'; ctx.beginPath(); ctx.arc(210, 130, 150, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(120,200,255,.10)'; ctx.beginPath(); ctx.arc(640, 310, 180, 0, 7); ctx.fill();
        layers.forEach(L => L.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.abs(Math.sin(t * 1.5 + s.ph))})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }));
        planets.forEach(p => {
          ctx.fillStyle = p.c; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
          if (p.ring) { ctx.strokeStyle = 'rgba(255,230,200,.85)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.6, p.r * 0.35, -0.3, 0, 7); ctx.stroke(); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0.35, Math.PI - 0.1); ctx.fill(); }
          ctx.globalAlpha = 1;
        });
        // the three lanes
        LANES.forEach(y => { ctx.setLineDash([10, 14]); ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]); });
        if (state === 'play' && danger) {
          ctx.fillStyle = `rgba(255,90,95,${0.14 + 0.07 * Math.sin(now / 120)})`;
          ctx.fillRect(0, LANES[lane] - 38, W, 76);
        }
        stars.forEach(s => star(s.x, LANES[s.lane] + Math.sin(t * 4 + s.ph) * 4, 15, C.yellow, 2.5));
        obs.forEach(drawObs);
        pDraw(parts);
        if (!(inv > 0 && Math.floor(now / 90) % 2 === 0)) drawRocket(RX, ry, tilt + Math.sin(t * 22) * 0.16 * wobble);
        if (hintActive && state === 'play') bubble(RX + 72, ry - 88, 'TAP!', now);

        hud(lives, score, hi, false);
        if (state === 'idle') banner('Space Dash', 'Press SPACE or tap to start', now, 'Hop lanes to dodge the space stuff!');
        else if (state === 'over') banner('Game Over', 'SPACE or tap to try again', now, 'Score ' + score + '   •   Best ' + hi);
      },
    };
  }

  // =====================================================================
  //  GAME 9: Colour Catch  (press when the matching colour is in the ring)
  // =====================================================================
  function makeColor() {
    const LANE_Y = 214, CX = W / 2, HIT = 62, SPACING = 175, LIVES = 3;
    const COLS = [
      { c: '#ff5a5f', d: '#d63e43' }, { c: '#4aa8ff', d: '#2b7fd6' }, { c: '#ffd54f', d: '#e6b020' },
      { c: '#5bc561', d: '#3a9d46' }, { c: '#b07cff', d: '#8a55e0' }, { c: '#ff9a3d', d: '#e07b1a' },
    ];
    let state, lives, score, hi, target, streak, items, parts, t, sinceSpawn, sinceTarget, overAt, hintActive, flashT, bump;
    hi = hiGet('color');
    const nCols = () => Math.min(6, 3 + Math.floor(score / 5));
    const speedNow = () => 110 + Math.min(score, 30) * 4;

    function pickKind() {
      const n = nCols();
      if (sinceTarget >= 2 || Math.random() < 0.4) { sinceTarget = 0; return target; }
      sinceTarget++;
      let k; do { k = Math.floor(Math.random() * n); } while (k === target && n > 1);
      return k;
    }
    function spawn(x) { items.push({ x, k: pickKind(), ph: Math.random() * 6, st: 'float', vx: 0, vy: 0, rot: 0, life: 1, hinted: false }); }
    function newTarget() {
      const n = nCols(); let k; do { k = Math.floor(Math.random() * n); } while (k === target && n > 1);
      target = k; flashT = 1;
    }
    function reset() {
      lives = LIVES; score = 0; streak = 0; t = 0; parts = []; items = []; hintActive = false; flashT = 0; bump = 0;
      target = 0; sinceTarget = 0; newTarget(); flashT = 0;
      for (let x = 60; x < W + 60; x += SPACING) spawn(x);
      sinceSpawn = SPACING - 100;
    }
    function startGame() { reset(); state = 'play'; sfx.start(); }
    function drawBub(x, y, col, r, glow) {
      if (glow) { ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(x, y, r + 11 + Math.sin(t * 6) * 3, 0, 7); ctx.fill(); }
      circ(x, y, r, col.c, 3.5);
      ctx.strokeStyle = col.d; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(x, y, r - 8, 0.25, 1.3); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(x - r * 0.38, y - r * 0.4, r * 0.24, r * 0.15, -0.6, 0, 7); ctx.fill();
    }

    return {
      id: 'color', name: 'Colour Catch', icon: '\u{1F3A8}', desc: 'Match the ring colour!', theme: ['#ffd6ee', '#ff9fb0'],
      help: 'Press <b>SPACE</b> (or tap) when a bubble with the <b>same colour as the ring</b> floats inside it!',
      enter() { reset(); state = 'idle'; },
      action() {
        if (state === 'idle') startGame();
        else if (state === 'over') { if (performance.now() - overAt > 600) startGame(); }
        else {
          let best = null;
          for (const it of items) if (it.st === 'float' && Math.abs(it.x - CX) <= HIT && (!best || Math.abs(it.x - CX) < Math.abs(best.x - CX))) best = it;
          if (!best) return;
          if (best.k === target) {
            best.st = 'gone'; score++; streak++; bump = 1;
            pBurst(parts, best.x, LANE_Y, COLS[best.k].c, 16); sfx.pop(); setTimeout(sfx.collect, 60);
            if (score > hi) { hi = score; hiSet('color', hi); }
            if (streak % 3 === 0) { newTarget(); setTimeout(sfx.point, 300); }
          } else {
            best.st = 'away'; best.vy = -380; best.vx = rand(-90, 90); lives--; bump = 1; sfx.hit();
            if (lives <= 0) { state = 'over'; overAt = performance.now(); if (score > hi) { hi = score; hiSet('color', hi); } sfx.over(); }
          }
        }
      },
      release() {},
      update(dt) {
        t += dt; parts = pStep(parts, dt); bump = Math.max(0, bump - dt * 3);
        if (flashT > 0) flashT -= dt;
        const sp = speedNow();
        sinceSpawn += sp * dt;
        if (sinceSpawn >= SPACING) { sinceSpawn -= SPACING; spawn(-50); }
        for (const it of items) {
          if (it.st === 'float') it.x += sp * dt;
          else if (it.st === 'away') { it.vy += 900 * dt; it.x += it.vx * dt; it.y = (it.y ?? LANE_Y) + it.vy * dt; it.rot += dt * 7; it.life -= dt * 0.8; }
        }
        items = items.filter(it => it.x < W + 70 && it.st !== 'gone' && it.life > 0);
        hintActive = false;
        if (state === 'play' && hintsOn) {
          for (const it of items) {
            const dx = CX - it.x;
            if (it.st === 'float' && it.k === target && dx <= sp * 0.3 + 15 && dx >= -35) {
              hintActive = true;
              if (!it.hinted) { it.hinted = true; sfx.hint(); }
              break;
            }
          }
        }
      },
      draw(now) {
        sky('#cfe3ff', '#fff1f8');
        ctx.lineCap = 'butt';
        for (let i = 0; i < 6; i++) {                                           // rainbow
          ctx.globalAlpha = 0.5; ctx.strokeStyle = COLS[i].c; ctx.lineWidth = 17;
          ctx.beginPath(); ctx.arc(CX, H + 100, 440 - i * 17, Math.PI, 2 * Math.PI); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        cloud(60 + Math.sin(t * 0.2) * 16, 130, 1); cloud(640 + Math.cos(t * 0.17) * 16, 120, 0.9);
        hills(0, H - 34, '#b6e89c', 40, 150, 1);
        ground(H - 30, 0, C.grass, C.dirt, C.dirtD);
        ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(-20, LANE_Y - 56, W + 40, 112, 56); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.setLineDash([2, 14]); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0, LANE_Y - 56); ctx.lineTo(W, LANE_Y - 56); ctx.moveTo(0, LANE_Y + 56); ctx.lineTo(W, LANE_Y + 56); ctx.stroke(); ctx.setLineDash([]);

        // the ring (always shows the colour to match)
        const rs = 1 + 0.08 * bump + (hintActive ? Math.sin(now / 90) * 0.03 : 0);
        ctx.save(); ctx.translate(CX, LANE_Y); ctx.scale(rs, rs);
        ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(0, 0, 56, 0, 7); ctx.fill();
        ctx.lineWidth = 18; ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.arc(0, 0, 56, 0, 7); ctx.stroke();
        ctx.lineWidth = 11; ctx.strokeStyle = COLS[target].c; ctx.beginPath(); ctx.arc(0, 0, 56, 0, 7); ctx.stroke();
        ctx.restore();

        items.forEach(it => {
          ctx.save(); ctx.globalAlpha = clamp(it.life, 0, 1);
          if (it.st === 'float') drawBub(it.x, LANE_Y + Math.sin(t * 2 + it.ph) * 8, COLS[it.k], 34, hintsOn && state === 'play' && it.k === target);
          else { ctx.translate(it.x, it.y); ctx.rotate(it.rot); drawBub(0, 0, COLS[it.k], 34, false); }
          ctx.restore();
        });
        pDraw(parts);
        if (hintActive) bubble(CX, LANE_Y - 130, 'NOW!', now);

        // colour to match
        box(160, 8, 170, 62, 18, 'rgba(255,255,255,.96)', 3);
        emoji('\u{1F3A8}', 195, 40, 30);
        const fp = flashT > 0 ? 1 + Math.sin(now / 50) * 0.12 : 1;
        circ(285, 39, 22 * fp, COLS[target].c, 3.5);
        ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(278, 31, 6, 4, -0.6, 0, 7); ctx.fill();

        hud(lives, score, hi, false);
        if (state === 'idle') banner('Colour Catch', 'Press SPACE or tap to start', now, 'Match the colour of the ring!');
        else if (state === 'over') banner('Game Over', 'SPACE or tap to try again', now, 'Score ' + score + '   •   Best ' + hi);
      },
    };
  }

  // =====================================================================
  //  Menu + main loop + input
  // =====================================================================
  const games = [makeDino(), makeBird(), makeStack(), makeFrog(), makeShop(), makeFish(), makeFeed(), makeSpace(), makeColor()];
  let current = null, sel = 0;

  const menuEl = document.getElementById('menu'), gameEl = document.getElementById('game');
  const helpEl = document.getElementById('help'), cardsEl = document.getElementById('cards');

  games.forEach((g, i) => {
    const d = document.createElement('div');
    d.className = 'card';
    d.style.setProperty('--c1', g.theme[0]); d.style.setProperty('--c2', g.theme[1]);
    d.innerHTML = `<div class="art"><span class="icon">${g.icon}</span></div><div class="key">${i + 1}</div>` +
                  `<div class="name">${g.name}</div><div class="desc">${g.desc}</div><div class="play">&#9654; PLAY</div>`;
    d.addEventListener('click', () => openGame(i));
    d.addEventListener('mouseenter', () => { sel = i; paintSel(); });
    cardsEl.appendChild(d);
  });
  function paintSel() { [...cardsEl.children].forEach((c, i) => c.classList.toggle('sel', i === sel)); }
  paintSel();

  function openGame(i) {
    audio();
    sel = i; paintSel();
    current = games[i]; current.enter();
    menuEl.hidden = true; gameEl.hidden = false;
    helpEl.innerHTML = current.help;
    document.title = current.name;
  }
  function openMenu() {
    current = null; gameEl.hidden = true; menuEl.hidden = false;
    document.title = 'One-Button Games';
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (current) {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      const cw = Math.round(canvas.clientWidth * dpr), ch = Math.round(canvas.clientHeight * dpr);
      if (cw && (canvas.width !== cw || canvas.height !== ch)) { canvas.width = cw; canvas.height = ch; }
      ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
      ctx.clearRect(0, 0, W, H);
      current.update(dt, now);
      current.draw(now);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const ACTION_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyM') { toggleMute(); return; }
    if (e.code === 'KeyH') { toggleHints(); return; }
    if (!current) {
      if (e.code === 'ArrowRight' || e.code === 'ArrowDown') { sel = (sel + 1) % games.length; paintSel(); e.preventDefault(); }
      else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') { sel = (sel + games.length - 1) % games.length; paintSel(); e.preventDefault(); }
      else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) openGame(sel); }
      else if (/^Digit[1-9]$/.test(e.code)) { const i = +e.code.slice(5) - 1; if (games[i]) openGame(i); }
      return;
    }
    if (e.code === 'Escape') { openMenu(); return; }
    if (ACTION_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) { audio(); current.action(); } }
  });
  window.addEventListener('keyup', e => {
    if (current && ACTION_KEYS.includes(e.code)) current.release();
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); audio(); if (current) current.action(); });
  window.addEventListener('pointerup', () => { if (current) current.release(); });
  window.addEventListener('pointercancel', () => { if (current) current.release(); });

  const muteBtn = document.getElementById('mute'), hintBtn = document.getElementById('hint');
  function toggleMute() {
    muted = !muted;
    muteBtn.innerHTML = muted ? '&#128263; Sound off (M)' : '&#128266; Sound on (M)';
    if (!muted) { audio(); tone(660, 0.1); }
  }
  function toggleHints() {
    hintsOn = !hintsOn;
    hintBtn.innerHTML = hintsOn ? '&#128161; Hints on (H)' : '&#128161; Hints off (H)';
  }
  muteBtn.addEventListener('click', e => { toggleMute(); e.currentTarget.blur(); });
  hintBtn.addEventListener('click', e => { toggleHints(); e.currentTarget.blur(); });
  document.getElementById('back').addEventListener('click', e => { openMenu(); e.currentTarget.blur(); });
})();
</script>
</body>
</html>
